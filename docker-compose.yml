services:
  postgres_db:
    image: postgres:16-alpine
    container_name: my_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: alex_developer
      POSTGRES_PASSWORD: my_secret_password
      POSTGRES_DB: bot_data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    container_name: my_telegram_bot
    restart: always
    depends_on:
      - postgres_db
    environment:
      - DB_HOST=postgres_db
      - DB_USER=alex_developer
      - DB_PASSWORD=my_secret_password
      - DB_NAME=bot_data
    env_file:
      - .env

volumes:
  pgdata: